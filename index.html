<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Airshift — Coming Soon</title>
  <meta name="description" content="Airshift is coming soon.">
  <meta property="og:title" content="Airshift — Coming Soon">
  <meta property="og:description" content="Something new is taking off.">
  <meta property="og:url" content="https://airshift.ai/">
  <meta name="theme-color" content="#0b1020">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1020'/%3E%3Cpath d='M14 44 L32 16 L50 44 M22 36 H42' stroke='%237dd3fc' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1020;
      --fg: #e8ecf5;
      --muted: #8f9bb3;
      --accent: #7dd3fc;
      --accent-2: #a78bfa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }
    .glow {
      position: fixed;
      inset: -20%;
      background:
        radial-gradient(40% 35% at 30% 30%, rgba(125, 211, 252, 0.18), transparent 70%),
        radial-gradient(35% 30% at 70% 65%, rgba(167, 139, 250, 0.16), transparent 70%);
      animation: drift 18s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes drift {
      from { transform: translate(-3%, -2%) rotate(0deg); }
      to   { transform: translate(3%, 2%) rotate(8deg); }
    }
    main {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 16px;
      gap: 28px;
    }
    .wordmark {
      font-family: "Space Grotesk", "Inter", system-ui, sans-serif;
      font-size: clamp(4rem, 15vw, 9.5rem);
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.045em;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      padding-bottom: 0.08em;
    }
    h2 {
      font-family: "Space Grotesk", "Inter", system-ui, sans-serif;
      font-size: clamp(1.25rem, 3.5vw, 1.9rem);
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--fg);
    }
    p.tagline {
      max-width: 34rem;
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      color: var(--muted);
      line-height: 1.6;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border: 1px solid rgba(232, 236, 245, 0.14);
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--fg);
      background: rgba(255, 255, 255, 0.04);
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 0 rgba(125, 211, 252, 0.6);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(125, 211, 252, 0.6); }
      70%  { box-shadow: 0 0 0 10px rgba(125, 211, 252, 0); }
      100% { box-shadow: 0 0 0 0 rgba(125, 211, 252, 0); }
    }
    footer {
      position: relative;
      text-align: center;
      padding: 24px 16px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    @media (prefers-reduced-motion: reduce) {
      .glow, .dot { animation: none; }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main>
    <h1 class="wordmark">Airshift</h1>
    <h2>Coming soon</h2>
    <p class="tagline">Something new is taking off. We're putting the finishing touches on it — check back soon.</p>
    <span class="badge"><span class="dot"></span> In the works</span>
  </main>
  <footer>&copy; <span id="y">2026</span> Airshift</footer>
  <script>document.getElementById("y").textContent = new Date().getFullYear();</script>
</body>
</html>
