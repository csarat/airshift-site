<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>airshift.ai</title>
  <meta name="description" content="airshift.ai">
  <link rel="canonical" href="https://airshift.ai/">
  <meta property="og:title" content="airshift.ai">
  <meta property="og:description" content="airshift.ai">
  <meta property="og:url" content="https://airshift.ai/">
  <meta name="theme-color" content="#0b1020">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1020'/%3E%3Cpath d='M14 44 L32 16 L50 44 M22 36 H42' stroke='%237dd3fc' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1020;
      --fg: #e8ecf5;
      --muted: #8f9bb3;
      --accent: #7dd3fc;
      --accent-2: #a78bfa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      position: relative;
    }
    .glow {
      position: fixed;
      inset: -20%;
      background:
        radial-gradient(40% 35% at 30% 30%, rgba(125, 211, 252, 0.18), transparent 70%),
        radial-gradient(35% 30% at 70% 65%, rgba(167, 139, 250, 0.16), transparent 70%);
      animation: drift 18s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes drift {
      from { transform: translate(-3%, -2%) rotate(0deg); }
      to   { transform: translate(3%, 2%) rotate(8deg); }
    }
    main {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 16px;
      gap: 28px;
    }
    .wordmark {
      font-family: "Space Grotesk", "Inter", system-ui, sans-serif;
      font-size: clamp(3.5rem, 20vw, 11rem);
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.045em;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      padding-bottom: 0.08em;
    }
    #dots {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 18px;
      padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
      font-size: 0.875rem;
      letter-spacing: 0.02em;
      color: var(--muted);
    }
    .link {
      font: inherit;
      letter-spacing: inherit;
      color: var(--muted);
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-color: rgba(143, 155, 179, 0.4);
      text-underline-offset: 3px;
      transition: color 0.2s, text-decoration-color 0.2s;
    }
    .link:hover, .link:focus-visible { color: var(--fg); text-decoration-color: var(--accent); }

    dialog {
      margin: auto;
      width: min(420px, calc(100% - 32px));
      padding: 28px;
      border: 1px solid rgba(232, 236, 245, 0.12);
      border-radius: 18px;
      background: rgba(17, 23, 43, 0.92);
      color: var(--fg);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
    }
    dialog::backdrop { background: rgba(5, 8, 18, 0.6); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
    dialog[open] { animation: pop 0.2s ease-out; }
    @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(0.98); } }
    .dialog-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .dialog-head h2 { font-family: "Space Grotesk", "Inter", sans-serif; font-weight: 500; font-size: 1.35rem; letter-spacing: -0.01em; }
    .close {
      width: 32px; height: 32px;
      border: 0; border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
      font-size: 1.25rem; line-height: 1;
      cursor: pointer;
    }
    .close:hover { color: var(--fg); background: rgba(255, 255, 255, 0.12); }
    form { display: flex; flex-direction: column; gap: 12px; }
    input, textarea {
      width: 100%;
      padding: 12px 14px;
      font: inherit;
      font-size: 1rem; /* 16px stops iOS zooming on focus */
      color: var(--fg);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(232, 236, 245, 0.14);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    textarea { resize: vertical; min-height: 110px; }
    input::placeholder, textarea::placeholder { color: rgba(143, 155, 179, 0.7); }
    input:focus, textarea:focus { border-color: var(--accent); background: rgba(255, 255, 255, 0.06); }
    .trap { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
    .send {
      margin-top: 4px;
      padding: 12px;
      font: inherit;
      font-weight: 500;
      color: #0b1020;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .send:disabled { opacity: 0.6; cursor: wait; }
    .status { min-height: 1.2em; font-size: 0.875rem; color: var(--muted); text-align: center; }
    .status.error { color: #fca5a5; }
    .thanks { text-align: center; padding: 12px 0 4px; color: var(--muted); line-height: 1.6; }
    .thanks strong { display: block; margin-bottom: 4px; font-family: "Space Grotesk", sans-serif; font-size: 1.25rem; font-weight: 500; color: var(--fg); }

    @media (prefers-reduced-motion: reduce) {
      .glow, dialog[open] { animation: none; }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <canvas id="dots" aria-hidden="true"></canvas>
  <main>
    <h1 class="wordmark">airshift.ai</h1>
  </main>
  <footer>
    <span>&copy; <span id="y">2026</span> airshift.ai. All rights reserved.</span>
    <button type="button" class="link" id="contact-open">Contact</button>
  </footer>

  <dialog id="contact" aria-labelledby="contact-title">
    <div class="dialog-head">
      <h2 id="contact-title">Get in touch</h2>
      <button type="button" class="close" id="contact-close" aria-label="Close">&times;</button>
    </div>
    <form id="contact-form" novalidate>
      <input type="email" name="email" placeholder="Your email" aria-label="Your email" autocomplete="email" required maxlength="200">
      <textarea name="message" placeholder="Message" aria-label="Message" required maxlength="2000"></textarea>
      <!-- honeypot: humans never see this, bots fill it in -->
      <input type="checkbox" name="botcheck" class="trap" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit" class="send">Send</button>
      <p class="status" id="contact-status" role="status"></p>
    </form>
  </dialog>

  <script>
    document.getElementById("y").textContent = new Date().getFullYear();

    (function () {
      // Web3Forms access key (public by design; it only lets this form send to the owner's inbox).
      var ACCESS_KEY = "31960000-04ae-43b8-9d18-a1ff50a1d9e0";
      var dialog = document.getElementById("contact");
      var form = document.getElementById("contact-form");
      var status = document.getElementById("contact-status");

      document.getElementById("contact-open").addEventListener("click", function () { dialog.showModal(); });
      document.getElementById("contact-close").addEventListener("click", function () { dialog.close(); });
      // click on the backdrop closes it
      dialog.addEventListener("click", function (e) { if (e.target === dialog) dialog.close(); });

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        status.className = "status";
        if (!form.checkValidity()) {
          status.textContent = "Please add your email and a message.";
          status.className = "status error";
          return;
        }
        var data = Object.fromEntries(new FormData(form));
        if (data.botcheck) return;
        var send = form.querySelector(".send");
        send.disabled = true;
        status.textContent = "Sending…";

        var request = ACCESS_KEY
          ? fetch("https://api.web3forms.com/submit", {
              method: "POST",
              headers: { "Content-Type": "application/json", Accept: "application/json" },
              body: JSON.stringify({
                access_key: ACCESS_KEY,
                subject: "airshift.ai contact",
                from_name: "airshift.ai",
                email: data.email,
                message: data.message,
                botcheck: false
              })
            }).then(function (r) { return r.json(); })
          // no key yet (local preview): pretend it worked
          : new Promise(function (ok) { setTimeout(function () { ok({ success: true }); }, 600); });

        request.then(function (res) {
          if (!res.success) throw new Error(res.message);
          form.outerHTML = '<p class="thanks"><strong>Thanks!</strong>Your message is on its way.</p>';
        }).catch(function () {
          send.disabled = false;
          status.textContent = "Couldn't send. Please try again.";
          status.className = "status error";
        });
      });
    })();
    (function () {
      var canvas = document.getElementById("dots");
      var ctx = canvas.getContext("2d");
      var colors = ["125, 211, 252", "167, 139, 250", "232, 236, 245"];
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var dots = [], w, h, dpr;

      function rand(a, b) { return a + Math.random() * (b - a); }

      function makeDot() {
        var p = Math.random();
        var r = p < 0.6 ? rand(0.8, 2) : p < 0.9 ? rand(2, 4) : rand(4, 9);
        return {
          x: rand(0, w), y: rand(0, h), r: r,
          // bigger dots drift slower, like they're further back
          vx: rand(-0.15, 0.15) / (r * 0.4 + 0.6),
          vy: rand(-0.35, -0.05) / (r * 0.4 + 0.6),
          a: rand(0.2, 0.75), phase: rand(0, Math.PI * 2),
          c: colors[Math.floor(Math.random() * colors.length)]
        };
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth; h = window.innerHeight;
        canvas.width = w * dpr; canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        var count = Math.round(Math.min(140, (w * h) / 9000));
        while (dots.length < count) dots.push(makeDot());
        dots.length = count;
      }

      function draw(t) {
        ctx.clearRect(0, 0, w, h);
        for (var i = 0; i < dots.length; i++) {
          var d = dots[i];
          if (!reduce) {
            d.x += d.vx; d.y += d.vy;
            if (d.y < -10) { d.y = h + 10; d.x = rand(0, w); }
            if (d.x < -10) d.x = w + 10;
            if (d.x > w + 10) d.x = -10;
          }
          var twinkle = reduce ? 1 : 0.75 + 0.25 * Math.sin(t / 1200 + d.phase);
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(" + d.c + "," + (d.a * twinkle) + ")";
          if (d.r > 3) { ctx.shadowBlur = d.r * 3; ctx.shadowColor = "rgba(" + d.c + ",0.5)"; }
          else ctx.shadowBlur = 0;
          ctx.fill();
        }
        if (!reduce) requestAnimationFrame(draw);
      }

      window.addEventListener("resize", resize);
      resize();
      requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
