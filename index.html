<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>airshift.ai — Coming Soon</title>
  <meta name="description" content="airshift.ai is coming soon.">
  <meta property="og:title" content="airshift.ai — Coming Soon">
  <meta property="og:description" content="Something new is taking off.">
  <meta property="og:url" content="https://airshift.ai/">
  <meta name="theme-color" content="#0b1020">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1020'/%3E%3Cpath d='M14 44 L32 16 L50 44 M22 36 H42' stroke='%237dd3fc' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1020;
      --fg: #e8ecf5;
      --muted: #8f9bb3;
      --accent: #7dd3fc;
      --accent-2: #a78bfa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      position: relative;
    }
    .glow {
      position: fixed;
      inset: -20%;
      background:
        radial-gradient(40% 35% at 30% 30%, rgba(125, 211, 252, 0.18), transparent 70%),
        radial-gradient(35% 30% at 70% 65%, rgba(167, 139, 250, 0.16), transparent 70%);
      animation: drift 18s ease-in-out infinite alternate;
      pointer-events: none;
    }
    @keyframes drift {
      from { transform: translate(-3%, -2%) rotate(0deg); }
      to   { transform: translate(3%, 2%) rotate(8deg); }
    }
    main {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 16px;
      gap: 28px;
    }
    .wordmark {
      font-family: "Space Grotesk", "Inter", system-ui, sans-serif;
      font-size: clamp(3.5rem, 20vw, 11rem);
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.045em;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      padding-bottom: 0.08em;
    }
    #dots {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      text-align: center;
      padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
      font-size: 0.875rem;
      letter-spacing: 0.02em;
      color: var(--muted);
    }
    @media (prefers-reduced-motion: reduce) {
      .glow { animation: none; }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <canvas id="dots" aria-hidden="true"></canvas>
  <main>
    <h1 class="wordmark">airshift.ai</h1>
  </main>
  <footer>&copy; <span id="y">2026</span> airshift.ai. All rights reserved.</footer>
  <script>
    document.getElementById("y").textContent = new Date().getFullYear();
    (function () {
      var canvas = document.getElementById("dots");
      var ctx = canvas.getContext("2d");
      var colors = ["125, 211, 252", "167, 139, 250", "232, 236, 245"];
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var dots = [], w, h, dpr;

      function rand(a, b) { return a + Math.random() * (b - a); }

      function makeDot() {
        var p = Math.random();
        var r = p < 0.6 ? rand(0.8, 2) : p < 0.9 ? rand(2, 4) : rand(4, 9);
        return {
          x: rand(0, w), y: rand(0, h), r: r,
          // bigger dots drift slower, like they're further back
          vx: rand(-0.15, 0.15) / (r * 0.4 + 0.6),
          vy: rand(-0.35, -0.05) / (r * 0.4 + 0.6),
          a: rand(0.2, 0.75), phase: rand(0, Math.PI * 2),
          c: colors[Math.floor(Math.random() * colors.length)]
        };
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth; h = window.innerHeight;
        canvas.width = w * dpr; canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        var count = Math.round(Math.min(140, (w * h) / 9000));
        while (dots.length < count) dots.push(makeDot());
        dots.length = count;
      }

      function draw(t) {
        ctx.clearRect(0, 0, w, h);
        for (var i = 0; i < dots.length; i++) {
          var d = dots[i];
          if (!reduce) {
            d.x += d.vx; d.y += d.vy;
            if (d.y < -10) { d.y = h + 10; d.x = rand(0, w); }
            if (d.x < -10) d.x = w + 10;
            if (d.x > w + 10) d.x = -10;
          }
          var twinkle = reduce ? 1 : 0.75 + 0.25 * Math.sin(t / 1200 + d.phase);
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(" + d.c + "," + (d.a * twinkle) + ")";
          if (d.r > 3) { ctx.shadowBlur = d.r * 3; ctx.shadowColor = "rgba(" + d.c + ",0.5)"; }
          else ctx.shadowBlur = 0;
          ctx.fill();
        }
        if (!reduce) requestAnimationFrame(draw);
      }

      window.addEventListener("resize", resize);
      resize();
      requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
